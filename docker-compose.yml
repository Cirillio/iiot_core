services:
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: adam_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?задай POSTGRES_USER в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:?задай POSTGRES_DB в .env}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./iiot_init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  client:
    dns: [8.8.8.8, 8.8.4.4]
    build: { context: ., dockerfile: IIoT.Collector/Dockerfile, network: host }
    container_name: modbus_client
    environment:
      - ConnectionStrings__ADAMDB=Host=db;Port=5432;Database=${POSTGRES_DB:?задай POSTGRES_DB в .env};Username=${POSTGRES_USER:?задай POSTGRES_USER в .env};Password=${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD в .env}
      - ModbusSettings__IpAddress=sim
      - ModbusSettings__Port=5020
      - Serilog__MinimumLevel=Debug
    depends_on:
      db:
        condition: service_healthy
      sim:
        condition: service_started
    restart: always

  sim:
    build: { context: ./sim, network: host }
    container_name: modbus_sim
    ports: ["5020:5020"]
    restart: always

  gateway:
    dns: [8.8.8.8, 8.8.4.4]
    build: { context: ., dockerfile: IIoT.WebApi/Dockerfile, network: host }
    container_name: modbus_web_gateway
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__AdamMonitoring=Host=db;Port=5432;Database=${POSTGRES_DB:?задай POSTGRES_DB в .env};Username=${POSTGRES_USER:?задай POSTGRES_USER в .env};Password=${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD в .env}
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,https://localhost:3000,http://localhost:5173,https://localhost:5173}
    ports: ["8080:80"]
    depends_on:
      db:
        condition: service_healthy
    restart: always

  admin:
    dns: [8.8.8.8, 8.8.4.4]
    build: { context: ./iiot_admin, dockerfile: Dockerfile }
    container_name: modbus_admin
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NUXT_PUBLIC_API_BASE=${NUXT_PUBLIC_API_BASE:-http://localhost:8080}
      - NODE_ENV=production
    ports: ["3000:3000"]
    depends_on:
      gateway:
        condition: service_started
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    network_mode: host
    restart: always
    command: ["tunnel", "run"]
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:?задай CLOUDFLARE_TUNNEL_TOKEN в .env}
      - TUNNEL_TRANSPORT_PROTOCOL=http2
      - TUNNEL_HEARTBEAT_INTERVAL=5s
      - TUNNEL_HEARTBEAT_COUNT=2
      - HTTP_PROXY=http://127.0.0.1:10809
      - HTTPS_PROXY=http://127.0.0.1:10809
      - NO_PROXY=localhost,127.0.0.1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

volumes:
  pgdata:
